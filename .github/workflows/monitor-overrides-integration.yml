name: Monitor overrides - Integration Tests

on:
  push:
    branches:
      - feat/monitor-overrides-prototype
  pull_request:
    branches:
      - feat/monitor-overrides-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration test (DRY_RUN)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Run integration DRY_RUN checks
        run: |
          set -e
          # iterate over fixture directories under tests/fixtures
          for d in tests/fixtures/*/ ; do
            if [ -d "$d" ]; then
              echo "=== Fixture: $d ==="
              pushd "$d"
              for ev in pr-body.json pr-comment.json issue-body.json issue-comment.json; do
                if [ -f "$ev" ]; then
                  echo "--- Running with event $ev ---"
                  node ../../../scripts/remove-override.js --event-path="$ev" --dry-run=true || true
                  echo "--- report content ---"
                  cat monitor-report.txt || true
                  echo "======================"
                fi
              done
              popd
            fi
          done

      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-monitor-reports
          path: |
            tests/fixtures/**/monitor-report.txt
            || true
