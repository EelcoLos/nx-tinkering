# Basic set up for three package managers

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
  # Npm Packages
  - package-ecosystem: 'npm'
    directory: '/'
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
    groups:
      client-angular:
        patterns:
          - '@angular/*'
      client-angular-devkit:
        patterns:
          - '@angular-devkit/*'
      client-angular-eslint:
        patterns:
          - '@angular-eslint/*'
      client-angular-schematics:
        patterns:
          - '@angular-devkit/schematics'
          - '@schematics/angular'
      client-jest:
        patterns:
          - 'jest'
          - 'jest-environment-jsdom'
      client-nx:
        patterns:
          - '@nx*'
          - 'nx'
      client-typescript-eslint:
        patterns:
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - '@nx/eslint-plugin'
      client-prettier:
        patterns:
          - 'prettier'
      client-eslint:
        patterns:
          - 'eslint'
          - '@eslint/js'
      client-react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-redux'
          - 'react-router-dom'
    labels:
      # Use our labels instead of default dependabot labels (we like consistency)
      - 'type: dependencies'
    open-pull-requests-limit: 99
    pull-request-branch-name:
      # This branch separator prevents creating deeply nested folder names due to the default '/' separator.
      # we like it better this way but its up to you to pick your preference.
      separator: '-'
    rebase-strategy: 'auto'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    target-branch: 'main'

  # Dotnet apps
  - package-ecosystem: 'nuget'
    directory: '/'
    ignore:
      - dependency-name: 'Microsoft.*'
        update-types: ['version-update:semver-major']
      # Pinned to 2.x on purpose, see Directory.Packages.props
      - dependency-name: 'Microsoft.OpenApi'
        update-types: ['version-update:semver-major']
    groups:
      nuget-fastendpoints:
        patterns:
          - 'FastEndpoints*'
      nuget-microsoft-identity-web:
        patterns:
          - 'Microsoft.Identity.Web*'
      nuget-xunit:
        patterns:
          - 'xunit*'

    labels:
      # Use our labels instead of default dependabot labels (we like consistency)
      - 'type: dependencies'
    open-pull-requests-limit: 99
    pull-request-branch-name:
      # This branch separator prevents creating deeply nested folder names due to the default '/' separator.
      # we like it better this way but its up to you to pick your preference.
      separator: '-'
    rebase-strategy: 'auto'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    target-branch: 'main'
